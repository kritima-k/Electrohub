<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElectroHub | Wishlist</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="cart.css">

<style>
.wishlist-header{
    padding:70px 0 40px;
    text-align:center;
}
.wishlist-header h1{
    font-size:3rem;
    font-weight:700;
    margin-bottom:12px;
}
.wishlist-header i{ color:#00c8ff; }
.wishlist-header p{
    color:#94a3b8;
    font-size:17px;
}

.wishlist-card{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    margin-bottom:25px;
    transition:.35s;
    animation:fadeUp .6s ease;
}
.wishlist-card:hover{
    transform:translateY(-5px);
    border-color:#00c8ff;
    box-shadow:0 15px 35px rgba(0,0,0,.35), 0 0 20px rgba(0,200,255,.15);
}
.wishlist-img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:14px;
}
.product-name{
    font-size:1.3rem;
    font-weight:700;
    color:white;
    margin-bottom:8px;
}
.product-price{
    color:#00c8ff;
    font-size:1.3rem;
    font-weight:700;
}
.move-cart-btn{
    width:100%;
    margin-top:14px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00c8ff,#2563eb);
    color:white;
    font-size:0.95rem;
    font-weight:600;
    transition:.3s;
}
.move-cart-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,200,255,.30);
}
.remove-wish-btn{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:#f87171;
    font-size:0.95rem;
    font-weight:600;
    transition:.3s;
}
.remove-wish-btn:hover{
    background:#dc3545;
    color:white;
}

/* Summary Card */
.summary-card{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:30px;
    position:sticky;
    top:20px;
    animation:fadeUp .6s ease;
}
.summary-card h3{
    font-size:1.6rem;
    font-weight:700;
    color:white;
    margin-bottom:22px;
}
.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
    color:#cbd5e1;
    font-size:1rem;
}
.move-all-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00c8ff,#2563eb);
    color:white;
    font-size:1rem;
    font-weight:600;
    transition:.3s;
}
.move-all-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(0,200,255,.30);
}
.clear-wish-btn{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-weight:600;
    transition:.3s;
}
.clear-wish-btn:hover{ background:#334155; }

/* Empty */
.empty-wish{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:70px;
    text-align:center;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation:fadeUp .6s ease;
}
.empty-wish i{
    font-size:80px;
    color:#00c8ff;
    margin-bottom:20px;
}
.empty-wish h2{
    font-size:2rem;
    font-weight:700;
    margin-bottom:14px;
}
.empty-wish p{
    color:#94a3b8;
    max-width:500px;
    margin:auto;
    line-height:1.8;
}
.shop-btn{
    display:inline-block;
    margin-top:28px;
    padding:14px 35px;
    background:linear-gradient(135deg,#00c8ff,#2563eb);
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}
.shop-btn:hover{
    color:white;
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(0,200,255,.35);
}

/* Toast */
.toast-msg{
    position:fixed;
    bottom:30px;
    right:30px;
    background:linear-gradient(135deg,#00c8ff,#2563eb);
    color:white;
    padding:14px 24px;
    border-radius:12px;
    font-weight:600;
    font-size:0.92rem;
    z-index:9999;
    display:none;
    animation:fadeUp .4s ease;
}

@media(max-width:991px){
    .summary-card{ margin-top:30px; position:static; }
    .wishlist-header h1{ font-size:2.2rem; }
}
@media(max-width:576px){
    .wishlist-header h1{ font-size:1.8rem; }
    .empty-wish{ padding:40px 20px; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-cpu-fill"></i> ElectroHub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                <li class="nav-item"><a class="nav-link active" href="wishlist.html">Wishlist</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HEADER -->
<section class="wishlist-header">
    <div class="container">
        <h1><i class="bi bi-heart-fill"></i> My Wishlist</h1>
        <p>Products you loved — save them for later!</p>
    </div>
</section>

<!-- WISHLIST SECTION -->
<section style="padding-bottom:80px;">
    <div class="container">
        <div class="row" id="wishlistMain">
            <!-- JS renders here -->
        </div>
    </div>
</section>

<!-- TOAST -->
<div class="toast-msg" id="toastMsg"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showToast(msg){
    const t = document.getElementById("toastMsg");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2500);
}

// Load Wishlist
function loadWishlist(){

    fetch("/get_wishlist")
    .then(res => res.json())
    .then(wishlist => {

        const container = document.getElementById("wishlistMain");

        if(wishlist.length === 0){

            container.innerHTML = `
            <div class="col-12">
                <div class="empty-wish">
                    <i class="bi bi-heart-slash-fill"></i>
                    <h2>Wishlist is Empty</h2>
                    <p>You haven't added anything yet.</p>

                    <a href="/product" class="shop-btn">
                        <i class="bi bi-bag-fill"></i>
                        Explore Products
                    </a>
                </div>
            </div>`;

            return;
        }

        let items = "";
        let total = 0;

        wishlist.forEach(item => {

            total += Number(item.price);

            items += `
            <div class="col-md-6 col-lg-4 mb-4">

                <div class="wishlist-card">

                    <img src="${item.image}" class="wishlist-img">

                    <div style="margin-top:16px">

                        <h5>${item.product_name}</h5>

                        <div class="product-price">
                            ₹${Number(item.price).toLocaleString("en-IN")}
                        </div>

                        <button class="move-cart-btn"
                        onclick="moveToCart(${item.id})">

                        <i class="bi bi-cart-plus-fill"></i>

                        Move to Cart

                        </button>

                        <button class="remove-wish-btn"
                        onclick="removeWishlist(${item.id})">

                        <i class="bi bi-trash-fill"></i>

                        Remove

                        </button>

                    </div>

                </div>

            </div>`;
        });

        container.innerHTML = `
        <div class="col-lg-9">

            <div class="row">

                ${items}

            </div>

        </div>

        <div class="col-lg-3">

            <div class="summary-card">

                <h3>Summary</h3>

                <div class="summary-item">

                    <span>Total Items</span>

                    <span>${wishlist.length}</span>

                </div>

                <div class="summary-item">

                    <span>Total Value</span>

                    <span>

                    ₹${total.toLocaleString("en-IN")}

                    </span>

                </div>

            </div>

        </div>`;
    });

}


// Remove Wishlist
function removeWishlist(id){

    fetch("/remove_wishlist/" + id,{
        method:"DELETE"
    })
    .then(res=>res.json())
    .then(data=>{

        showToast("Removed!");

        loadWishlist();

    });

}


// Move to Cart
function moveToCart(id){

    fetch("/move_to_cart/" + id,{
        method:"POST"
    })
    .then(res=>res.json())
    .then(data=>{

        showToast("Moved to Cart!");

        loadWishlist();

    });

}

loadWishlist();

</script>

</body>
</html>
